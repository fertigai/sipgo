# Mirrors fertigai/ci actions (source of truth); Renovate keeps the digests in sync.
name: Security
on: { pull_request: null, push: { branches: [main] }, workflow_dispatch: null } # dispatch scans the full history
permissions: { contents: read }
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: secrets
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || '' }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" "ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f" \
            git /repo --redact --no-banner --verbose ${RANGE:+--log-opts="$RANGE"}
      - name: dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          t() { docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/trivy:/cache" -v "$PWD:/src:ro" -w /src "ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c" "$@" --cache-dir /cache --skip-version-check --no-progress; }
          for repo in mirror.gcr.io/aquasec/trivy-db ghcr.io/aquasecurity/trivy-db; do t image --download-db-only --db-repository "$repo" && ok=1 && break; done
          [ -n "${ok:-}" ] || { echo "::error::Trivy DB download failed from every repository"; exit 1; }
          ignorefile=.trivyignore.yaml; [ -f "$ignorefile" ] || ignorefile=/dev/null
          t fs --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile "$ignorefile" .
